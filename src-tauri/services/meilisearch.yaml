schema: 1
id: meilisearch
name: Meilisearch
category: search
blurb: Search engine
origin: Official Meilisearch Community builds from GitHub (checksum checked); runs in development mode, with its search preview at its URL
homepage: https://www.meilisearch.com
license: MIT
source:
  github: meilisearch/meilisearch
  # A release sometimes ships without one platform's build (1.56.2 had no Apple silicon file).
  versions: newest
  assets:
    windows-x64: { file: meilisearch-windows-amd64.exe, archive: file }
    linux-x64: { file: meilisearch-linux-amd64, archive: file }
    linux-arm64: { file: meilisearch-linux-aarch64, archive: file }
    macos-x64: { file: meilisearch-macos-amd64, archive: file }
    macos-arm64: { file: meilisearch-macos-apple-silicon, archive: file }
binary: "meilisearch{{exe}}"
ports:
  http: { default: 7700, hint: "Its API and search preview" }
dirs: ["{{data}}"]
run:
  program: "{{home}}/meilisearch{{exe}}"
  # Development mode: no master key, and its search preview at the root URL.
  args: [--db-path, "{{data}}/data.ms", --dump-dir, "{{data}}/dumps", --http-addr, "127.0.0.1:{{port.http}}", --env, development, --no-analytics]
  cwd: "{{data}}"
health: { http: { path: /health } }
config: "{{data}}"
open: { label: Open search preview, port: http }
connection:
  url: "http://127.0.0.1:{{port.http}}"
  env:
    MEILISEARCH_HOST: "http://127.0.0.1:{{port.http}}"
    MEILISEARCH_KEY: ""
keywords: [search, full text]
docs: https://www.meilisearch.com/docs
