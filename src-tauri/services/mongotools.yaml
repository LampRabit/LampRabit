schema: 1
id: mongotools
kind: cli
name: MongoDB Database Tools
category: tools
blurb: MongoDB backups
origin: MongoDB's mongodump and mongorestore (checksum checked); LampRabit's MongoDB backups use them
homepage: https://www.mongodb.com/docs/database-tools/
license: Apache-2.0
keywords: [mongodb, mongodump, mongorestore, backup]

source:
  json:
    url: https://downloads.mongodb.org/tools/db/full.json
    items: versions
    version: version
    files: downloads
    file: { name: "{var.name}", arch: "{var.arch}" }
    download: "{file.archive.url}"
    sha256: "{file.archive.sha256}"
vars:
  name:
    - { value: windows, on: [windows-x64] }
    - { value: macos, on: [macos] }
    - { value: ubuntu1804, on: [linux] }
  arch:
    # MongoDB's macOS tools are x86_64 builds (Rosetta runs them on Apple silicon).
    - { value: x86_64, on: [macos] }
    - { value: x86_64, on: [x64] }
    - { value: arm64, on: [linux-arm64] }
binary: "bin/mongodump{{exe}}"

needs:
  - { runtime: mongodb, why: It works with LampRabit's MongoDB }
