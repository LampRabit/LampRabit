schema: 1
id: opensearch
name: OpenSearch
category: search
blurb: Search engine
origin: "Official OpenSearch archives (SHA-512 checked) with their own Java; one node, security off, 512 MB of memory unless you give it more"
unavailable: { value: "OpenSearch has no macOS build. Use Elasticsearch, which works the same for most apps.", on: [macos] }
homepage: https://opensearch.org
license: Apache-2.0
source:
  github: opensearch-project/OpenSearch
  versions: per-major
  min: 2
  url: "https://artifacts.opensearch.org/releases/bundle/opensearch/{version}/{file}"
  checksum: { sha512: "{url}.sha512" }
  label: 1 GB+ RAM
  assets:
    windows-x64: { file: "opensearch-{version}-windows-x64.zip", archive: zip }
    linux-x64: { file: "opensearch-{version}-linux-x64.tar.gz", archive: targz }
    linux-arm64: { file: "opensearch-{version}-linux-arm64.tar.gz", archive: targz }
binary: "bin/opensearch{{script}}"
ports:
  http: { default: 9201, setting: opensearch, label: HTTP }
  transport: { default: 9301, setting: opensearchTransport, label: Transport }
settings:
  heap:
    label: Memory (Java heap)
    description: More helps large indexes; the computer needs at least this much free.
    type: choice
    options: [512m, 1g, 2g, 4g]
    default: 512m
dirs: ["{{data}}", "{{logs}}"]
files:
  # As for Elasticsearch: the install's config, then LampRabit's settings on top.
  - copy: "{{home}}/config"
  - path: opensearch.yml
    content: |
      # Generated by LampRabit. Changes are overwritten on every start.
      cluster.name: lamprabit
      node.name: lamprabit
      path.data: "{{data|slash}}"
      path.logs: "{{logs|slash}}"
      network.host: 127.0.0.1
      http.port: {{port.http}}
      transport.port: {{port.transport}}
      discovery.type: single-node
      cluster.routing.allocation.disk.threshold_enabled: false
      plugins.security.disabled: true
  - path: jvm.options.d/lamprabit.options
    content: |
      # Set by LampRabit (the service's Memory setting).
      -Xms{{setting.heap}}
      -Xmx{{setting.heap}}
run:
  program: "{{home}}/bin/opensearch{{script}}"
  env:
    OPENSEARCH_PATH_CONF: "{{etc}}"
health: { http: { path: / } }
behaviour: { heavy: true, slow: true }
config: "{{etc}}/opensearch.yml"
connection:
  url: "http://127.0.0.1:{{port.http}}"
  env:
    OPENSEARCH_HOST: "http://127.0.0.1:{{port.http}}"
