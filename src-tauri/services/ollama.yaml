schema: 1
id: ollama
name: Ollama
category: ai
blurb: Local AI models
origin: Ollama's own builds from GitHub (a large download). Models go to LampRabit's data folder; the ollama command uses this server
homepage: https://ollama.com
license: MIT
source:
  github: ollama/ollama
  assets:
    windows-x64: { file: ollama-windows-amd64.zip, archive: zip }
    windows-arm64: { file: ollama-windows-arm64.zip, archive: zip }
    linux-x64: { file: ollama-linux-amd64.tar.zst, archive: tarzst }
    linux-arm64: { file: ollama-linux-arm64.tar.zst, archive: tarzst }
    macos: { file: ollama-darwin.tgz, archive: targz }
  label: Large download
  # Linux archives put it in bin/ (next to lib/ollama); Windows and macOS at the top.
binary:
  - { value: bin/ollama, on: [linux] }
  - { value: "ollama{{exe}}" }
ports:
  api: { default: 11434, hint: "Its API" }
dirs: ["{{data}}"]
run:
  program:
    - { value: "{{home}}/bin/ollama", on: [linux] }
    - { value: "{{home}}/ollama{{exe}}" }
  args: [serve]
  env:
    OLLAMA_HOST: "127.0.0.1:{{port.api}}"
    # Its models in data/ollama, not the user's ~/.ollama (a separate Ollama keeps those).
    OLLAMA_MODELS: "{{data}}/models"
health: { http: { path: /api/version } }
behaviour: { heavy: true }
config: "{{data}}"
connection:
  url: "http://127.0.0.1:{{port.api}}"
  env:
    OLLAMA_HOST: "http://127.0.0.1:{{port.api}}"
# The Ollama app installed by its own installer is used while LampRabit has none; it keeps
# its models where it always does, so the user's downloaded models stay available.
external:
  paths:
    - { value: "{{env.LOCALAPPDATA}}/Programs/Ollama/ollama.exe", on: [windows] }
    - { values: [/Applications/Ollama.app/Contents/Resources/ollama, /usr/local/bin/ollama, /opt/homebrew/bin/ollama], on: [macos] }
    - { values: [/usr/local/bin/ollama, /usr/bin/ollama], on: [linux] }
  args: [serve]
  env:
    OLLAMA_HOST: "127.0.0.1:{{port.api}}"
keywords: [ai, llm, models, chat]
docs: https://docs.ollama.com/
