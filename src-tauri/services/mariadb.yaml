# my.ini, the data folder and its version guard are written in Rust (configs::write_mariadb,
# init_mariadb_data), as are the mysql shims and the default database that depend on it.
schema: 1
id: mariadb
name: MariaDB
category: databases
blurb: Stores your data
origin:
  - { value: "LampRabit's builds of MariaDB's LTS releases (MariaDB publishes none for macOS)", on: [macos] }
  - { value: Official MariaDB releases }
homepage: https://mariadb.org
license: GPL-2.0
source:
  # MariaDB publishes no macOS builds; LampRabit's CI builds the LTS lines from source.
  - { on: [macos], lamprabit: true }
  # Its REST API: the stable series, then each one's latest release and its files.
  - on: [windows, linux-x64]
    json:
      url: https://downloads.mariadb.org/rest-api/mariadb/
      items: major_releases
      where: { release_status: Stable }
      then: { url: "https://downloads.mariadb.org/rest-api/mariadb/{item.release_id}/latest/", items: "releases.*" }
      version: release_id
      files: files
      file: { file_name: "{var.file}" }
      download: "{file.file_download_url}"
      sha256: "{file.checksum.sha256sum}"
      label: { from: parent.release_support_type, map: { Long Term Support: LTS } }
    versions: all
binary: "bin/mariadbd{{exe}}"
suggests: [karotx, phpmyadmin, adminer]
ports:
  # `mysql` predates MySQL support: it's MariaDB's.
  mysql: { default: 3306, hint: "Database" }
run:
  program: "{{home}}/bin/mariadbd{{exe}}"
  # --defaults-file must be the first argument.
  args: ["--defaults-file={{etc}}/my.ini"]
stop:
  command: ["{{home}}/bin/mariadb-admin{{exe}}", "--defaults-file={{etc}}/my.ini", --user=root, shutdown]
health: { mysql: {} }
log: mariadb-error.log
config: "{{etc}}/my.ini"
connection:
  url: "mariadb://root@127.0.0.1:{{port.mysql}}"
  env:
    DB_CONNECTION: mariadb
    DB_HOST: 127.0.0.1
    DB_PORT: "{{port.mysql}}"
    DB_USERNAME: root
    DB_PASSWORD: ""
# Written before every start; the Unix socket goes in its own tmp folder.
dirs: ["{{tmp}}"]
files:
  - path: "{{etc}}/my.ini"
    content: |
      # Generated by LampRabit. Changes are overwritten on every start.
      [mysqld]
      basedir="{{home|slash}}"
      datadir="{{data|slash}}"
      port={{port.mysql}}
      bind-address={{var.bind}}
      {{var.socket}}character-set-server=utf8mb4
      collation-server=utf8mb4_unicode_ci
      log-error="{{log|slash}}"
      max_allowed_packet=64M
      # Level 1 keeps real warnings but not "Aborted connection" notes from health checks.
      log_warnings=1
      innodb_buffer_pool_size=256M

      [client]
      port={{port.mysql}}
      {{var.socket}}default-character-set=utf8mb4
vars:
  # The download for this platform (source.json above).
  file:
    - { value: "*winx64.zip", on: [windows] }
    - { value: "*linux-systemd-x86_64.tar.gz", on: [linux-x64] }
  # Both loopback addresses where the server takes a list (10.11+); never all interfaces,
  # root has no password.
  bind:
    - { value: "{{loopback}}", if: "version>=10.11" }
    - { value: 127.0.0.1 }
  socket:
    - { value: "socket=\"{{tmp|slash}}/mysql.sock\"\n", on: [unix] }
    - { value: "" }
# The system tables on first start; root gets an empty password, like XAMPP and Laragon.
init:
  done: ["{{data}}/mysql"]
  run:
    - { program: "{{home}}/bin/mariadb-install-db{{exe}}", args: ["--datadir={{data}}"], on: [windows] }
    - { program: "{{home}}/scripts/mariadb-install-db", args: [--no-defaults, "--basedir={{home}}", "--datadir={{data}}", --auth-root-authentication-method=normal], on: [unix] }
# An older release line can damage newer data; a newer one upgrades the system tables.
guard:
  marker: "{{data}}/lamprabit-version"
  when: "{{data}}/mysql"
  upgrade: ["{{home}}/bin/mariadb-upgrade{{exe}}", "--defaults-file={{etc}}/my.ini", --user=root]
keywords: [mysql, sql, database]
docs: https://mariadb.com/kb/en/documentation/
