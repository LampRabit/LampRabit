schema: 1
id: clickhouse
name: ClickHouse
category: databases
blurb: Analytics database
origin: Official ClickHouse builds from GitHub. Its web console is at /play on its HTTP port
unavailable: { value: "ClickHouse has no Windows build. Run it in WSL, or use LampRabit on Linux or macOS.", on: [windows] }
homepage: https://clickhouse.com
license: Apache-2.0
source:
  github: ClickHouse/ClickHouse
  # Its releases are tagged v25.8.1.1-lts, v25.9.2.1-stable, -testing…: only these two.
  versions: newest
  tags: { -lts: LTS, -stable: Stable }
  assets:
    linux-x64: { file: "clickhouse-common-static-{version}-amd64.tgz", archive: targz }
    linux-arm64: { file: "clickhouse-common-static-{version}-arm64.tgz", archive: targz }
    macos-x64: { file: clickhouse-macos, archive: file }
    macos-arm64: { file: clickhouse-macos-aarch64, archive: file }
binary: usr/bin/clickhouse
ports:
  http: { default: 8123, hint: "Queries over HTTP and the /play console", label: HTTP }
  # Not ClickHouse's usual 9000, which PHP's FastCGI ports use.
  tcp: { default: 19000, hint: "clickhouse-client and native drivers", label: Native }
dirs: ["{{data}}", "{{tmp}}"]
files:
  # Only on 127.0.0.1, logs to the console (LampRabit's log), `default` without a password.
  - path: config.xml
    content: |
      <!-- Generated by LampRabit. Changes are overwritten on every start. -->
      <clickhouse>
          <logger>
              <level>warning</level>
              <console>1</console>
          </logger>
          <listen_host>127.0.0.1</listen_host>
          <http_port>{{port.http}}</http_port>
          <tcp_port>{{port.tcp}}</tcp_port>
          <path>{{data|slash}}/</path>
          <tmp_path>{{tmp|slash}}/</tmp_path>
          <user_files_path>{{data|slash}}/user_files/</user_files_path>
          <format_schema_path>{{data|slash}}/format_schemas/</format_schema_path>
          <user_directories>
              <users_xml>
                  <path>users.xml</path>
              </users_xml>
          </user_directories>
          <mlock_executable>false</mlock_executable>
      </clickhouse>
  - path: users.xml
    content: |
      <!-- Generated by LampRabit. -->
      <clickhouse>
          <profiles><default/></profiles>
          <quotas><default/></quotas>
          <users>
              <default>
                  <password></password>
                  <networks><ip>127.0.0.1</ip><ip>::1</ip></networks>
                  <profile>default</profile>
                  <quota>default</quota>
                  <access_management>1</access_management>
              </default>
          </users>
      </clickhouse>
run:
  program: "{{home}}/usr/bin/clickhouse"
  args: [server, "--config-file={{etc}}/config.xml"]
  cwd: "{{data}}"
health: { http: { path: /ping } }
behaviour: { heavy: true }
config: "{{etc}}/config.xml"
open: { label: Open console, port: http, path: /play }
connection:
  url: "http://127.0.0.1:{{port.http}}"
  env:
    CLICKHOUSE_HOST: 127.0.0.1
    CLICKHOUSE_PORT: "{{port.http}}"
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: ""
keywords: [analytics, olap, sql, database]
docs: https://clickhouse.com/docs
