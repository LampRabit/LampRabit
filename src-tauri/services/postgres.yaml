# initdb and the root role run in Rust (configs::init_postgres_data, postgres_root_role), and
# on Windows with administrator rights it's started through pg_ctl (`--pg-elevated`).
schema: 1
id: postgres
name: PostgreSQL
category: databases
blurb: Stores your data
origin: PostgreSQL built from source for every OS by theseus-rs (checksum checked); psql and pg_dump work in LampRabit's terminal
homepage: https://www.postgresql.org
license: PostgreSQL
source:
  # Built from source for every OS by theseus-rs; the newest release of each major from 14.
  github: theseus-rs/postgresql-binaries
  versions: per-major
  min: 14
  label: "PostgreSQL {major}"
  assets:
    windows-x64: { file: "postgresql-{version}-x86_64-pc-windows-msvc.zip", archive: zip }
    windows-arm64: { file: "postgresql-{version}-aarch64-pc-windows-msvc.zip", archive: zip }
    linux-x64: { file: "postgresql-{version}-x86_64-unknown-linux-gnu.tar.gz", archive: targz }
    linux-arm64: { file: "postgresql-{version}-aarch64-unknown-linux-gnu.tar.gz", archive: targz }
    macos-x64: { file: "postgresql-{version}-x86_64-apple-darwin.tar.gz", archive: targz }
    macos-arm64: { file: "postgresql-{version}-aarch64-apple-darwin.tar.gz", archive: targz }
binary: "bin/postgres{{exe}}"
suggests: [karotx, adminer, phppgadmin, pgadmin]
ports:
  postgres: { default: 5432, hint: "Database" }
# A data folder only works with the major version that created it.
data: per-major
health: { postgres: {} }
log: postgres-output.log
config: "{{data}}"
connection:
  url: "postgresql://root@127.0.0.1:{{port.postgres}}/postgres"
  env:
    DB_CONNECTION: pgsql
    DB_HOST: 127.0.0.1
    DB_PORT: "{{port.postgres}}"
    DB_USERNAME: root
    DB_PASSWORD: ""
run:
  program: "{{home}}/bin/postgres{{exe}}"
  # Only on 127.0.0.1, and no Unix socket: its default folder (/var/run/postgresql) usually
  # doesn't exist or isn't writable, and clients get PGHOST from the shims.
  args: [-D, "{{data}}", -p, "{{port.postgres}}", -c, listen_addresses=127.0.0.1, -c, "unix_socket_directories="]
  env:
    LD_LIBRARY_PATH: { value: "{{home}}/lib", on: [linux] }
  # PostgreSQL refuses to run with administrator rights; pg_ctl drops them, and LampRabit
  # stands in for it (lib.rs: --pg-elevated) so the supervisor works unchanged.
  elevated:
    args: [--pg-elevated, "{{home}}/bin/pg_ctl{{exe}}", "{{data}}", "{{port.postgres}}", "{{tmp}}/pgctl.log"]
    stop: ["{{home}}/bin/pg_ctl{{exe}}", stop, -D, "{{data}}", -m, fast, -s]
# A fast shutdown: open connections are closed, nothing is lost.
stop:
  command: ["{{home}}/bin/pg_ctl{{exe}}", stop, -D, "{{data}}", -m, fast, -s]
dirs: ["{{tmp}}"]
init:
  done: ["{{data}}/PG_VERSION"]
  run:
    - { program: "{{home}}/bin/initdb{{exe}}", args: [-D, "{{data}}", -U, postgres, -A, trust, -E, UTF8, --no-locale] }
  explain:
    administrative: PostgreSQL refuses to run with administrator rights; start LampRabit normally, not as administrator.
    root: PostgreSQL refuses to run with administrator rights; start LampRabit normally, not as administrator.
# Framework defaults (DB_USERNAME=root) work against it: a root superuser, added once.
after_start:
  - program: "{{home}}/bin/psql{{exe}}"
    args: [-h, 127.0.0.1, -p, "{{port.postgres}}", -U, postgres, -d, postgres, -qtAc, "DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'root') THEN CREATE ROLE root SUPERUSER LOGIN; END IF; END $$;"]
keywords: [pgsql, sql, database]
docs: https://www.postgresql.org/docs/
config_files:
  - { path: "{{data}}/postgresql.conf" }
  - { path: "{{data}}/pg_hba.conf", label: "pg_hba.conf (who may connect)" }
# The Backups panel: pg_dump's custom format (compressed; pg_restore can clean what it
# replaces), restored into a database created when it doesn't exist.
backup:
  extension: dump
  list:
    program: "{{home}}/bin/psql{{exe}}"
    args: [-h, 127.0.0.1, -p, "{{port.postgres}}", -U, postgres, -d, postgres, -tAc, "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres' ORDER BY 1"]
  dump:
    - program: "{{home}}/bin/pg_dump{{exe}}"
      args: [-h, 127.0.0.1, -p, "{{port.postgres}}", -U, postgres, -F, c, -f, "{{file}}", -d, "{{database}}"]
  restore:
    - program: "{{home}}/bin/createdb{{exe}}"
      args: [-h, 127.0.0.1, -p, "{{port.postgres}}", -U, postgres, -E, UTF8, -T, template0, "{{database}}"]
      if_missing: true
    # --no-owner: the backup may come from another user's server.
    - program: "{{home}}/bin/pg_restore{{exe}}"
      args: [-h, 127.0.0.1, -p, "{{port.postgres}}", -U, postgres, --clean, --if-exists, --no-owner, -d, "{{database}}", "{{file}}"]
