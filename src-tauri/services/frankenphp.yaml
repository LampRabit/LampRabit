schema: 1
id: frankenphp
name: FrankenPHP
category: web
blurb: Serves your sites
origin: "Official FrankenPHP releases: Caddy with its own PHP built in, so LampRabit's PHP versions and extensions don't apply to its sites"
unavailable: { value: FrankenPHP publishes no build for Intel Macs., on: [macos-x64] }
homepage: https://frankenphp.dev
license: MIT
source:
  github: php/frankenphp
  assets:
    windows-x64: { file: frankenphp-windows-x86_64.zip, archive: zip }
    linux-x64: { file: frankenphp-linux-x86_64, archive: file }
    linux-arm64: { file: frankenphp-linux-aarch64, archive: file }
    macos-arm64: { file: frankenphp-mac-arm64, archive: file }
binary: "frankenphp{{exe}}"
health: { http: { path: / } }
log: frankenphp-error.log
config: "{{etc}}/Caddyfile"
# Caddy with PHP built in: the same commands under its own name. The site engine writes its
# Caddyfile and its PHP settings (etc/frankenphp/conf.d).
engine: frankenphp
run:
  program: "{{home}}/frankenphp{{exe}}"
  args: [run, --config, "{{etc}}/Caddyfile", --adapter, caddyfile]
  test: [validate, --config, "{{etc}}/Caddyfile", --adapter, caddyfile]
  env:
    # Its state (certificates it would fetch, autosaved config) in tmp/<id>, not the user's home.
    XDG_CONFIG_HOME: "{{tmp}}"
    XDG_DATA_HOME: "{{tmp}}"
    PHP_INI_SCAN_DIR: "{{etc}}/conf.d"
stop:
  command: ["{{home}}/frankenphp{{exe}}", stop, --address, "127.0.0.1:{{server.admin}}"]
