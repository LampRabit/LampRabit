schema: 1
id: nginx
name: Nginx
category: web
blurb: Serves your sites
origin:
  - { value: "Official nginx.org Windows builds (PGP-signed, no checksum)", on: [windows] }
  - { value: LampRabit's builds of nginx.org releases }
homepage: https://nginx.org
license: BSD-2-Clause
source:
  # nginx.org's Windows builds. It publishes PGP signatures rather than checksums, so these
  # rely on HTTPS alone.
  - on: [windows]
    page:
      url: https://nginx.org/en/download.html
      link: '^/download/nginx-(?P<version>[\d.]+)\.zip$'
      labels: [Mainline, Stable]
    versions: per-line
    keep: 4
    archive: zip
    checksum: none
  - { lamprabit: true }
binary: "nginx{{exe}}"
health: { http: { path: / } }
log: nginx-error.log
config: "{{etc}}/nginx.conf"
# The site engine writes nginx.conf, the virtual hosts and PHP's pools before every start;
# its writable prefix (logs/, temp/) is tmp/nginx.
engine: nginx
run:
  program: "{{home}}/nginx{{exe}}"
  # Stay in the foreground, as on Windows (see Apache).
  args: [-p, "{{tmp|slash}}/", -c, "{{etc}}/nginx.conf", { values: [-g, "daemon off;"], on: [unix] }]
  test: [-p, "{{tmp|slash}}/", -c, "{{etc}}/nginx.conf", -t]
stop:
  command: ["{{home}}/nginx{{exe}}", -p, "{{tmp|slash}}/", -c, "{{etc}}/nginx.conf", -s, quit]
