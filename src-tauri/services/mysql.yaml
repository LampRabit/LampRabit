schema: 1
id: mysql
name: MySQL
category: databases
blurb: Stores your data
origin: Official MySQL releases; runs next to MariaDB on its own port
homepage: https://www.mysql.com
license: GPL-2.0
# docker-library's list of current MySQL lines; the archives are on Oracle's CDN, which
# publishes MD5s. macOS archives carry the macOS version they're built for, which moves on.
source:
  json:
    url: https://raw.githubusercontent.com/docker-library/mysql/master/versions.json
    items: "*"
    version: version
    download: "https://cdn.mysql.com/Downloads/MySQL-{line}/mysql-{version}-{asset}"
    label: { from: "@key", map: { innovation: Innovation }, else: LTS }
  versions: all
  assets:
    windows: { file: winx64.zip, archive: zip }
    # "minimal": stripped of debug symbols and tests, about a tenth of the full archive.
    linux-x64: { file: linux-glibc2.28-x86_64-minimal.tar.xz, archive: tarxz }
    linux-arm64: { file: linux-glibc2.28-aarch64-minimal.tar.xz, archive: tarxz }
    macos-arm64: { file: macos26-arm64.tar.gz, archive: targz, fallbacks: [macos15-arm64.tar.gz, macos14-arm64.tar.gz] }
    macos-x64: { file: macos26-x86_64.tar.gz, archive: targz, fallbacks: [macos15-x86_64.tar.gz, macos14-x86_64.tar.gz] }
  checksum: { md5: "{url}.md5" }
binary: "bin/mysqld{{exe}}"
suggests: [karotx, phpmyadmin, adminer]
ports:
  mysql: { default: 3307, hint: "Database, next to MariaDB" }
run:
  program: "{{home}}/bin/mysqld{{exe}}"
  # --defaults-file must be the first argument; --console keeps errors on stderr on
  # Windows, where they'd otherwise only go to the event log.
  args: ["--defaults-file={{etc}}/my.ini", { value: --console, on: [windows] }]
  env:
    # Where the libaio link goes when needed (configs::mysql_libraries).
    LD_LIBRARY_PATH: { value: "{{home}}/lib/compat", on: [linux] }
stop:
  command: ["{{home}}/bin/mysqladmin{{exe}}", "--defaults-file={{etc}}/my.ini", --user=root, shutdown]
health: { mysql: {} }
log: mysql-error.log
config: "{{etc}}/my.ini"
connection:
  url: "mysql://root@127.0.0.1:{{port.mysql}}"
  env:
    DB_CONNECTION: mysql
    DB_HOST: 127.0.0.1
    DB_PORT: "{{port.mysql}}"
    DB_USERNAME: root
    DB_PASSWORD: ""
# MySQL can't be downgraded and upgrades are one-way, so each release line (8.4, 9.7…)
# keeps its own data folder and switching versions is always safe.
data: per-line
# The pid file and Unix socket go in its own tmp folder.
dirs: ["{{tmp}}"]
files:
  - path: "{{etc}}/my.ini"
    content: |
      # Generated by LampRabit. Changes are overwritten on every start.
      [mysqld]
      basedir="{{home|slash}}"
      datadir="{{data|slash}}"
      port={{port.mysql}}
      bind-address={{var.bind}}
      {{var.socket}}character-set-server=utf8mb4
      collation-server=utf8mb4_0900_ai_ci
      log-error="{{log|slash}}"
      pid-file="{{tmp|slash}}/mysqld.pid"
      max_allowed_packet=64M
      innodb_buffer_pool_size=256M
      # The X Protocol port (33060) isn't needed for PHP and would clash between versions.
      mysqlx=OFF
      {{var.native}}
      [client]
      port={{port.mysql}}
      {{var.socket}}default-character-set=utf8mb4
vars:
  bind:
    - { value: "{{loopback}}", if: "version>=8.0" }
    - { value: 127.0.0.1 }
  socket:
    - { value: "socket=\"{{tmp|slash}}/mysqld.sock\"\n", on: [unix] }
    - { value: "" }
  # 8.4 ships native passwords off, but many PHP apps and tools still expect them; 9.0
  # removed the plugin, so the option would stop newer versions starting.
  native:
    - { value: "mysql_native_password=ON\n", if: "version<9" }
    - { value: "" }
# The system tables on first start of a release line (mysqld creates the folder itself
# and refuses one that exists).
init:
  done: ["{{data}}/mysql.ibd", "{{data}}/mysql"]
  creates_folder: true
  run:
    - { program: "{{home}}/bin/mysqld{{exe}}", args: ["--defaults-file={{etc}}/my.ini", --initialize-insecure] }
# Its generic Linux builds link libaio and libnuma; Ubuntu 24.04+ and Debian 13 renamed
# libaio's file, so a link under the old name goes in lib/compat (on LD_LIBRARY_PATH above).
libraries:
  check: "{{home}}/bin/mysqld"
  dir: "{{home}}/lib/compat"
  renamed: { libaio.so.1: libaio.so.1t64 }
  hint: "MySQL needs system libraries that aren't installed ({missing}). Install them, then start MySQL again: sudo apt install libaio1t64 libnuma1 (Ubuntu 24.04+, Debian 13), sudo apt install libaio1 libnuma1 (older Ubuntu/Debian), or sudo dnf install libaio numactl-libs (Fedora)."
