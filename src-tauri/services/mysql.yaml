schema: 1
id: mysql
name: MySQL
category: databases
blurb: Stores your data
origin: Official MySQL releases; runs next to MariaDB on its own port
homepage: https://www.mysql.com
license: GPL-2.0
# docker-library's list of current MySQL lines; the archives are on Oracle's CDN, which
# publishes MD5s. macOS archives carry the macOS version they're built for, which moves on.
source:
  json:
    url: https://raw.githubusercontent.com/docker-library/mysql/master/versions.json
    items: "*"
    version: version
    download: "https://cdn.mysql.com/Downloads/MySQL-{line}/mysql-{version}-{asset}"
    label: { from: "@key", map: { innovation: Innovation }, else: LTS }
  versions: all
  assets:
    windows: { file: winx64.zip, archive: zip }
    # "minimal": stripped of debug symbols and tests, about a tenth of the full archive.
    linux-x64: { file: linux-glibc2.28-x86_64-minimal.tar.xz, archive: tarxz }
    linux-arm64: { file: linux-glibc2.28-aarch64-minimal.tar.xz, archive: tarxz }
    macos-arm64: { file: macos26-arm64.tar.gz, archive: targz, fallbacks: [macos15-arm64.tar.gz, macos14-arm64.tar.gz] }
    macos-x64: { file: macos26-x86_64.tar.gz, archive: targz, fallbacks: [macos15-x86_64.tar.gz, macos14-x86_64.tar.gz] }
  checksum: { md5: "{url}.md5" }
binary: "bin/mysqld{{exe}}"
suggests: [phpmyadmin, adminer]
ports:
  mysql: { default: 3307, hint: "Database, next to MariaDB" }
run:
  program: "{{home}}/bin/mysqld{{exe}}"
  # --defaults-file must be the first argument; --console keeps errors on stderr on
  # Windows, where they'd otherwise only go to the event log.
  args: ["--defaults-file={{etc}}/my.ini", { value: --console, on: [windows] }]
  env:
    # Where the libaio link goes when needed (configs::mysql_libraries).
    LD_LIBRARY_PATH: { value: "{{home}}/lib/compat", on: [linux] }
stop:
  command: ["{{home}}/bin/mysqladmin{{exe}}", "--defaults-file={{etc}}/my.ini", --user=root, shutdown]
health: { mysql: {} }
log: mysql-error.log
config: "{{etc}}/my.ini"
connection:
  url: "mysql://root@127.0.0.1:{{port.mysql}}"
  env:
    DB_CONNECTION: mysql
    DB_HOST: 127.0.0.1
    DB_PORT: "{{port.mysql}}"
    DB_USERNAME: root
    DB_PASSWORD: ""
builtin: [prepare]
