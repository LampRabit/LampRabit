# The web servers are LampRabit's core: their vhosts, PHP pools, certificates and the hosts
# file are generated in Rust (sites.rs, configs.rs), so most of their parts are builtin.
schema: 1
id: apache
name: Apache
category: web
blurb: Serves your sites
origin:
  - { value: Apache Lounge builds, on: [windows] }
  - { value: LampRabit's builds of Apache httpd }
homepage: https://httpd.apache.org
license: Apache-2.0
source:
  # Apache Lounge only hosts its latest build; its checksum is in "<file>.txt".
  - on: [windows]
    page:
      url: https://www.apachelounge.com/download/
      link: '/httpd-(?P<version>2\.4\.\d+)-\d+-Win64-(?P<label>VS\d+)\.zip$'
    archive: zip
    checksum: { sha256: "{url}.txt" }
  - { lamprabit: true }
binary: "bin/httpd{{exe}}"
health: { http: { path: / } }
log: apache-error.log
config: "{{etc}}/httpd.conf"
builtin: [ports, prepare, launch]
