schema: 1
id: caddy
name: Caddy
category: web
blurb: Serves your sites
origin: Official Caddy releases from GitHub; uses LampRabit's certificates and PHP, not its own
homepage: https://caddyserver.com
license: Apache-2.0
source:
  github: caddyserver/caddy
  assets:
    windows-x64: { file: "caddy_{version}_windows_amd64.zip", archive: zip }
    windows-arm64: { file: "caddy_{version}_windows_arm64.zip", archive: zip }
    linux-x64: { file: "caddy_{version}_linux_amd64.tar.gz", archive: targz }
    linux-arm64: { file: "caddy_{version}_linux_arm64.tar.gz", archive: targz }
    macos-x64: { file: "caddy_{version}_mac_amd64.tar.gz", archive: targz }
    macos-arm64: { file: "caddy_{version}_mac_arm64.tar.gz", archive: targz }
binary: "caddy{{exe}}"
health: { http: { path: / } }
log: caddy-error.log
config: "{{etc}}/Caddyfile"
# The site engine writes the Caddyfile (virtual hosts, PHP's pools) before every start.
engine: caddy
run:
  program: "{{home}}/caddy{{exe}}"
  args: [run, --config, "{{etc}}/Caddyfile", --adapter, caddyfile]
  test: [validate, --config, "{{etc}}/Caddyfile", --adapter, caddyfile]
  env:
    # Its state (certificates it would fetch, autosaved config) in tmp/<id>, not the user's home.
    XDG_CONFIG_HOME: "{{tmp}}"
    XDG_DATA_HOME: "{{tmp}}"
# Through the admin API: a clean shutdown on Windows too, where there's no SIGTERM.
stop:
  command: ["{{home}}/caddy{{exe}}", stop, --address, "127.0.0.1:{{server.admin}}"]
keywords: [web server, caddyfile]
docs: https://caddyserver.com/docs/
