schema: 1
id: rabbitmq
name: RabbitMQ
category: queues
blurb: Message queue
origin: Official RabbitMQ releases (checksum checked) with the management console (user guest, password guest)
homepage: https://www.rabbitmq.com
license: MPL-2.0
source:
  github: rabbitmq/rabbitmq-server
  assets:
    windows: { file: "rabbitmq-server-windows-{version}.zip", archive: zip }
    unix: { file: "rabbitmq-server-generic-unix-{version}.tar.xz", archive: tarxz }
binary: "sbin/rabbitmq-server{{script}}"
# On Windows it runs on LampRabit's Erlang; elsewhere on the system's.
needs:
  # rabbitmq.com/docs/which-erlang (checked 2026-11-04). Elsewhere RabbitMQ runs on the
  # system's Erlang (system_needs below), which LampRabit can't install.
  - { runtime: erlang, min: "27.0", max: "29", since: "4.3.7", on: [windows], why: RabbitMQ runs on Erlang }
  - { runtime: erlang, min: "27.0", max: "28", since: "4.3.6", until: "4.3.7", on: [windows], why: RabbitMQ runs on Erlang }
  - { runtime: erlang, min: "27.0", max: "27", since: "4.3.3", until: "4.3.6", on: [windows], why: RabbitMQ runs on Erlang }
  - { runtime: erlang, min: "26.2", max: "27", since: "4.3", until: "4.3.3", on: [windows], why: RabbitMQ runs on Erlang }
  - { runtime: erlang, min: "27.0", max: "27", since: "4.2.9", until: "4.3", on: [windows], why: RabbitMQ runs on Erlang }
  - { runtime: erlang, min: "26.2", max: "27", since: "4.0.4", until: "4.2.9", on: [windows], why: RabbitMQ runs on Erlang }
  - { runtime: erlang, min: "26.2", max: "26.2", until: "4.0.4", on: [windows], why: RabbitMQ runs on Erlang }
system_needs:
  - command: erl
    on: [unix]
    hint: "RabbitMQ runs on Erlang, which isn't installed. Install it with your system's packages (sudo apt install erlang-nox, sudo dnf install erlang, or brew install erlang), then start RabbitMQ again."
ports:
  amqp: { default: 5672, hint: "AMQP, what apps connect to", label: AMQP }
  management: { default: 15672, hint: "Its management console", label: Management console }
dirs: ["{{data}}", "{{logs}}"]
files:
  # AMQP and the management console on 127.0.0.1 only.
  - path: rabbitmq.conf
    content: |
      # Generated by LampRabit. Changes are overwritten on every start.
      listeners.tcp.default = 127.0.0.1:{{port.amqp}}
      management.tcp.ip = 127.0.0.1
      management.tcp.port = {{port.management}}
  - path: enabled_plugins
    content: |
      [rabbitmq_management].
run:
  program: "{{home}}/sbin/rabbitmq-server{{script}}"
  env:
    RABBITMQ_BASE: "{{data}}"
    RABBITMQ_MNESIA_BASE: "{{data}}/mnesia"
    RABBITMQ_LOG_BASE: "{{logs}}"
    RABBITMQ_CONFIG_FILE: "{{etc}}/rabbitmq.conf"
    RABBITMQ_ENABLED_PLUGINS_FILE: "{{etc}}/enabled_plugins"
    RABBITMQ_NODENAME: lamprabit@localhost
    ERL_EPMD_ADDRESS: 127.0.0.1
    ERLANG_HOME: { value: "{{needs.erlang.home}}", on: [windows] }
stop:
  command: ["{{home}}/sbin/rabbitmqctl{{script}}", stop, -n, lamprabit@localhost]
health: { tcp: {} }
behaviour: { heavy: true, slow: true }
config: "{{etc}}/rabbitmq.conf"
connection:
  url: "amqp://guest:guest@127.0.0.1:{{port.amqp}}"
  env:
    QUEUE_CONNECTION: rabbitmq
    RABBITMQ_HOST: 127.0.0.1
    RABBITMQ_PORT: "{{port.amqp}}"
    RABBITMQ_USER: guest
    RABBITMQ_PASSWORD: guest
