# Java projects get a <Host> each in server.xml (configs::render_tomcat), and the Java it
# runs on depends on Tomcat's major version (configs::tomcat_java): both stay in Rust.
schema: 1
id: tomcat
name: Tomcat
category: web
blurb: Runs Java web apps
origin: Official Apache Tomcat releases (SHA-512 checked); runs on the active Java and serves Java projects behind your web server
homepage: https://tomcat.apache.org
license: Apache-2.0
# The newest release of each supported line from Apache's mirror, with the SHA-512 file
# published next to each archive.
source:
  page:
    url: "https://dlcdn.apache.org/tomcat/tomcat-{variant}/"
    link: '^v(?P<version>\d+\.\d+\.\d+)/$'
    variants:
      - { value: "11", label: "Jakarta EE 11 · Java 17+" }
      - { value: "10", label: "Jakarta EE 10 · Java 11+" }
      - { value: "9", label: "Java EE 8 (javax) · Java 8+" }
    download: "https://dlcdn.apache.org/tomcat/tomcat-{variant}/v{version}/bin/{asset}"
  assets:
    windows: { file: "apache-tomcat-{version}.zip", archive: zip }
    unix: { file: "apache-tomcat-{version}.tar.gz", archive: targz }
  checksum: { sha512: "{url}.sha512" }
binary: bin/bootstrap.jar
needs:
  - { runtime: java, min: "17", since: "11", why: Tomcat runs on the active Java }
  - { runtime: java, min: "11", since: "10", until: "11", why: Tomcat runs on the active Java }
  - { runtime: java, min: "8", until: "10", why: Tomcat runs on the active Java }
ports:
  http: { default: 8180, hint: "Java web apps, behind the web server", label: HTTP }
  shutdown: { default: 8105, hint: "Tomcat's stop command, 127.0.0.1 only", label: Shutdown }
# A 404 for / is fine: only apps under their own Host are deployed.
health: { http: { path: / } }
log: tomcat-output.log
connection:
  url: "http://127.0.0.1:{{port.http}}"
  env:
    TOMCAT_URL: "http://127.0.0.1:{{port.http}}"
# Its CATALINA_BASE is etc/tomcat, with a <Host> per Java project (the site engine).
run:
  program: "{{needs.java.bin}}/java{{exe}}"
  args:
    - "-Dcatalina.home={{home}}"
    - "-Dcatalina.base={{etc}}"
    - "-Djava.io.tmpdir={{tmp}}/temp"
    - -Djava.util.logging.manager=org.apache.juli.ClassLoaderLogManager
    - "-Djava.util.logging.config.file={{etc}}/conf/logging.properties"
    - -cp
    - "{{home}}/bin/bootstrap.jar{{pathsep}}{{home}}/bin/tomcat-juli.jar"
    - org.apache.catalina.startup.Bootstrap
    - start
  env:
    JAVA_HOME: "{{needs.java.home}}"
    CATALINA_HOME: "{{home}}"
    CATALINA_BASE: "{{etc}}"
stop:
  command:
    - "{{needs.java.bin}}/java{{exe}}"
    - "-Dcatalina.home={{home}}"
    - "-Dcatalina.base={{etc}}"
    - "-Djava.io.tmpdir={{tmp}}/temp"
    - -Djava.util.logging.manager=org.apache.juli.ClassLoaderLogManager
    - "-Djava.util.logging.config.file={{etc}}/conf/logging.properties"
    - -cp
    - "{{home}}/bin/bootstrap.jar{{pathsep}}{{home}}/bin/tomcat-juli.jar"
    - org.apache.catalina.startup.Bootstrap
    - stop
# The site engine writes etc/tomcat (server.xml with a <Host> per Java project) before
# every start.
engine: tomcat
keywords: [java, servlet, jakarta]
docs: https://tomcat.apache.org/
config_files:
  - { path: "{{etc}}/conf/server.xml" }
