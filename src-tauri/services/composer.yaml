schema: 1
id: composer
kind: cli
name: Composer
category: packages
blurb: PHP packages
origin: PHP's package manager from getcomposer.org (SHA-256 checked); run composer from the LampRabit terminal
homepage: https://getcomposer.org
license: MIT
docs: https://getcomposer.org/doc/
keywords: [php, packages, vendor]

source:
  json:
    url: https://getcomposer.org/versions
    items: stable
    version: version
    download: "https://getcomposer.org{item.path}"
    # Not "LTS": one-click installs prefer an LTS, and 2.2 is only for old PHP.
    label: { from: item.lts, map: { "true": "LTS for PHP 5.3–7.1" }, else: "" }
  versions: all
  archive: file
  # Never installed without a checksum: it runs with your project's rights.
  checksum: { sha256: "{url}.sha256sum" }
binary: composer.phar

# Composer 2.2 (its LTS line) still runs on PHP 5.3; 2.3 and later need 7.2.5.
needs:
  - { runtime: php, min: "5.3.2", until: "2.3", why: Composer runs on PHP }
  - { runtime: php, min: "7.2.5", since: "2.3", why: Composer runs on PHP }
