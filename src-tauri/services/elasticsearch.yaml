schema: 1
id: elasticsearch
name: Elasticsearch
category: search
blurb: Search engine
origin: "Official Elasticsearch archives (SHA-512 checked) with their own Java; one node, security off, 512 MB of memory unless you give it more"
homepage: https://www.elastic.co/elasticsearch
license: AGPL-3.0
source:
  github: elastic/elasticsearch
  versions: per-major
  min: 8
  url: "https://artifacts.elastic.co/downloads/elasticsearch/{file}"
  checksum: { sha512: "{url}.sha512" }
  label: 1 GB+ RAM
  assets:
    windows-x64: { file: "elasticsearch-{version}-windows-x86_64.zip", archive: zip }
    linux-x64: { file: "elasticsearch-{version}-linux-x86_64.tar.gz", archive: targz }
    linux-arm64: { file: "elasticsearch-{version}-linux-aarch64.tar.gz", archive: targz }
    macos-x64: { file: "elasticsearch-{version}-darwin-x86_64.tar.gz", archive: targz }
    macos-arm64: { file: "elasticsearch-{version}-darwin-aarch64.tar.gz", archive: targz }
binary: "bin/elasticsearch{{script}}"
ports:
  # Each its own, so Elasticsearch and OpenSearch can run side by side.
  http: { default: 9200, hint: "Its HTTP API", label: HTTP }
  transport: { default: 9300, hint: "Node-to-node, 127.0.0.1 only", label: Transport }
settings:
  heap:
    label: Memory (Java heap)
    description: More helps large indexes; the computer needs at least this much free.
    type: choice
    options: [512m, 1g, 2g, 4g]
    default: 512m
dirs: ["{{data}}", "{{logs}}"]
files:
  # The install's config files, copied fresh, with LampRabit's settings on top: one node on
  # 127.0.0.1, security off (local only), 512 MB of heap, and no read-only switch when the
  # disk gets full.
  - copy: "{{home}}/config"
  - path: elasticsearch.yml
    content: |
      # Generated by LampRabit. Changes are overwritten on every start.
      cluster.name: lamprabit
      node.name: lamprabit
      path.data: "{{data|slash}}"
      path.logs: "{{logs|slash}}"
      network.host: 127.0.0.1
      http.port: {{port.http}}
      transport.port: {{port.transport}}
      discovery.type: single-node
      cluster.routing.allocation.disk.threshold_enabled: false
      xpack.security.enabled: false
      xpack.security.enrollment.enabled: false
      xpack.ml.enabled: false
      ingest.geoip.downloader.enabled: false
  - path: jvm.options.d/lamprabit.options
    content: |
      # Set by LampRabit (the service's Memory setting).
      -Xms{{setting.heap}}
      -Xmx{{setting.heap}}
run:
  # Its own launcher, on its bundled Java, with LampRabit's config folder.
  program: "{{home}}/bin/elasticsearch{{script}}"
  env:
    ES_PATH_CONF: "{{etc}}"
health: { http: { path: / } }
behaviour: { heavy: true, slow: true }
config: "{{etc}}/elasticsearch.yml"
connection:
  url: "http://127.0.0.1:{{port.http}}"
  env:
    ELASTICSEARCH_HOST: "http://127.0.0.1:{{port.http}}"
