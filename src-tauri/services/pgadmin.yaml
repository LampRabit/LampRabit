# A Python web app in its own virtual environment: the package folder is found at start and
# LampRabit's PostgreSQL is registered in it (configs::write_pgadmin, register_pgadmin_server).
schema: 1
id: pgadmin
name: pgAdmin
category: tools
blurb: PostgreSQL admin
origin: "PostgreSQL's official admin tool from PyPI, in its own Python environment (needs Python 3.10–3.14); LampRabit's PostgreSQL is added for you"
homepage: https://www.pgadmin.org
license: PostgreSQL
# PyPI's newest pgAdmin 4: one wheel for every platform, with PyPI's SHA-256.
source:
  json:
    url: https://pypi.org/pypi/pgadmin4/json
    # Every release (keyed by version), so a skipped one falls back to the one before.
    items: releases.*
    version: "@key"
    files: ""
    file: { filename: "*.whl", yanked: "false" }
    download: "{file.url}"
    sha256: "{file.digests.sha256}"
  versions: newest
  # 9.19's wheel on PyPI has no static/js/generated bundles: pgadmin.test stays on
  # "Loading pgAdmin 4…" with 404s (checked 2026-11-24; 9.18 has all 49 files).
  skip: ["9.19"]
  archive: file
  # pip only installs a wheel under its real file name.
  save_as: "pgadmin4-{version}-py3-none-any.whl"
binary: installed.txt
needs:
  # Its wheels are built for 3.13; 3.15 isn't supported yet.
  - { runtime: python, min: "3.10", max: "3.14", prefer: "3.13", why: pgAdmin runs in a Python environment }
  - { runtime: postgres, why: "pgAdmin manages LampRabit's PostgreSQL" }
ports:
  http: { default: 5050, hint: "Its web server, behind pgadmin.test" }
health: { http: { path: /misc/ping } }
behaviour: { slow: true }
log: pgadmin.log
config: "{{data}}"
ui: { domain: pgadmin, port: http }
connection:
  url: "http://127.0.0.1:{{port.http}}"
  env:
    PGADMIN_URL: "http://127.0.0.1:{{port.http}}"
# Its own virtual environment on the needed Python, with the wheel and its dependencies
# from PyPI.
install:
  clean: ["{{home}}/venv"]
  run:
    - { program: "{{needs.python.bin}}/python.exe", on: [windows], args: [-m, venv, "{{home}}/venv"] }
    - { program: "{{needs.python.bin}}/python3", on: [unix], args: [-m, venv, "{{home}}/venv"] }
    - { program: "{{home}}/venv/Scripts/python.exe", on: [windows], args: [-m, pip, install, --disable-pip-version-check, --no-input, "{{home}}/pgadmin4-{{version}}-py3-none-any.whl"] }
    - { program: "{{home}}/venv/bin/python3", on: [unix], args: [-m, pip, install, --disable-pip-version-check, --no-input, "{{home}}/pgadmin4-{{version}}-py3-none-any.whl"] }
vars:
  # Its package folder: lib/pythonX.Y/… names the Python version outside Windows.
  package:
    - { value: "{{home}}/venv/Lib/site-packages/pgadmin4", on: [windows] }
    - { glob: "{{home}}/venv/lib/python*/site-packages/pgadmin4" }
dirs: ["{{data}}", "{{tmp}}"]
files:
  - path: "{{var.package}}/config_local.py"
    content: |
      # Generated by LampRabit. Changes are overwritten on every start.
      import os

      SERVER_MODE = False
      DEFAULT_SERVER = '127.0.0.1'
      DEFAULT_SERVER_PORT = {{port.http}}
      DATA_DIR = '{{data|slash}}'
      LOG_FILE = '{{log|slash}}'
      SQLITE_PATH = os.path.join(DATA_DIR, 'pgadmin4.db')
      SESSION_DB_PATH = os.path.join(DATA_DIR, 'sessions')
      STORAGE_DIR = os.path.join(DATA_DIR, 'storage')
      AZURE_CREDENTIAL_CACHE_DIR = os.path.join(DATA_DIR, 'azurecredentialcache')
      KERBEROS_CCACHE_DIR = os.path.join(DATA_DIR, 'krbccache')
      MASTER_PASSWORD_REQUIRED = False
      UPGRADE_CHECK_ENABLED = False
      # Behind LampRabit's web server (https://pgadmin.test proxies to this port).
      PROXY_X_FOR_COUNT = 1
      PROXY_X_PROTO_COUNT = 1
      PROXY_X_HOST_COUNT = 1
      ENHANCED_COOKIE_PROTECTION = False
      WTF_CSRF_SSL_STRICT = False
  - path: "{{tmp}}/servers.json"
    content: '{"Servers": {"1": {"Name": "LampRabit PostgreSQL", "Group": "LampRabit", "Host": "127.0.0.1", "Port": {{ports.postgres.postgres}}, "MaintenanceDB": "postgres", "Username": "root", "SSLMode": "disable"}}}'
# LampRabit's PostgreSQL in its tree on first open, added once.
once:
  - marker: "{{data}}/lamprabit-servers.json"
    if: installed.postgres
    run:
      - { program: "{{home}}/venv/Scripts/python.exe", on: [windows], args: ["{{var.package}}/setup.py", load-servers, "{{tmp}}/servers.json"], cwd: "{{var.package}}" }
      - { program: "{{home}}/venv/bin/python3", on: [unix], args: ["{{var.package}}/setup.py", load-servers, "{{tmp}}/servers.json"], cwd: "{{var.package}}" }
# pgAdmin's own entry point, on its environment's Python, in desktop mode (no login).
run:
  program:
    - { value: "{{home}}/venv/Scripts/python.exe", on: [windows] }
    - { value: "{{home}}/venv/bin/python3" }
  args: ["{{var.package}}/pgAdmin4.py"]
  cwd: "{{var.package}}"
  env:
    # Its output in our log right away rather than when Python's buffer fills.
    PYTHONUNBUFFERED: "1"
    PGADMIN_SERVER_MODE: "OFF"
keywords: [postgres, postgresql, admin, gui]
docs: https://www.pgadmin.org/docs/
config_files:
  - { path: "{{var.package}}/config_local.py" }
