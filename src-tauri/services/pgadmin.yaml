# A Python web app in its own virtual environment: the package folder is found at start and
# LampRabit's PostgreSQL is registered in it (configs::write_pgadmin, register_pgadmin_server).
schema: 1
id: pgadmin
name: pgAdmin
category: tools
blurb: PostgreSQL admin
origin: "PostgreSQL's official admin tool from PyPI, in its own Python environment (needs Python 3.10–3.14); LampRabit's PostgreSQL is added for you"
homepage: https://www.pgadmin.org
license: PostgreSQL
source: { builtin: true }
binary: installed.txt
needs:
  # Its wheels are built for 3.13; 3.15 isn't supported yet.
  - { runtime: python, min: "3.10", max: "3.14", prefer: "3.13", why: pgAdmin runs in a Python environment }
  - { runtime: postgres, why: "pgAdmin manages LampRabit's PostgreSQL" }
ports:
  http: { default: 5050, hint: "Its web server, behind pgadmin.test" }
health: { http: { path: /misc/ping } }
behaviour: { slow: true }
log: pgadmin.log
config: "{{data}}"
ui: { domain: pgadmin, port: http }
connection:
  url: "http://127.0.0.1:{{port.http}}"
  env:
    PGADMIN_URL: "http://127.0.0.1:{{port.http}}"
builtin: [prepare, launch]
